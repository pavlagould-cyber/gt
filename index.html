<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gould Therapy">
<meta name="mobile-web-app-capable" content="yes">
<title>Gould Therapy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a4a7a; }
  iframe { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; border: none; display: block; }
</style>
</head>
<body>
<iframe id="app" scrolling="yes" allowfullscreen></iframe>
<script>
  // The app's own storage lives inside Google's iframe, which iPhones wipe.
  // So this page (github.io) also remembers the therapist's name/email and hands it to the app.
  var APP_URL = 'https://script.google.com/macros/s/AKfycbxQLEbmZLYDiYZNUnNdeONWRHBE2syWswn48mTg1MEGPUpaDoQRfRT2iX5aNfNGr83f6w/exec?v=15';
  var user = null;
  try { user = JSON.parse(localStorage.getItem('gt_user') || 'null'); } catch (e) {}
  var src = APP_URL;
  if (user && user.name && user.email) {
    src += '&n=' + encodeURIComponent(user.name) + '&e=' + encodeURIComponent(user.email);
  }
  document.getElementById('app').src = src;

  window.addEventListener('message', function (ev) {
    var host = '';
    try { host = new URL(ev.origin).hostname; } catch (e) { return; }
    if (!/(^|\.)googleusercontent\.com$|(^|\.)google\.com$/.test(host)) return;
    var d = ev.data;
    if (d && d.type === 'gt_user' && d.name && d.email) {
      try { localStorage.setItem('gt_user', JSON.stringify({ name: d.name, email: d.email })); } catch (e) {}
    }
  });
</script>
</body>
</html>
